<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Validation App</title>
    <link rel="stylesheet" href="age.css">
</head>
<body>

    <div class="container">
        <h1>Age Validator</h1>
        <p>Enter your age to check your age group.</p>

        <form id="ageForm">
            <label for="ageInput">Enter your age:</label>

            <input
                type="number"
                id="ageInput"
                placeholder="e.g. 18"
                min="0"
                max="120"
                required
            >

            <button type="submit">Validate Age</button>
        </form>

        <p id="result" role="status" aria-live="polite"></p>
    </div>

    <script src="age.js"></script>
</body>
</html>
